[workspace]
members = ["apps/desktop/src-tauri", "crates/*", "packages/test-fixtures/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[workspace.dependencies]
blake3 = "=1.8.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
getrandom = "=0.4.3"
thiserror = "=2.0.19"
zeroize = "=1.8.2"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
url = "=2.5.8"
