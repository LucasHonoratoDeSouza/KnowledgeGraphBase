name: Setup Tauri Linux build
description: >-
  Single source of truth for the Node/corepack/Rust toolchain, Rust build
  cache, apt Tauri Linux system dependencies, and workspace install shared by
  ci.yml, release-dev.yml, and release-stable.yml. Assumes the caller has
  already run actions/checkout — this action does not check out the repo.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri -> ../../target

    - uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        version-file: pyproject.toml

    - name: Install Tauri Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

    - name: Install workspace dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        uv sync --locked --all-packages
